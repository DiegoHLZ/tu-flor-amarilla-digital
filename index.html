const experience=document.querySelector('#experience'),start=document.querySelector('#start'),replay=document.querySelector('#replay'),musicToggle=document.querySelector('#musicToggle'),musicFrame=document.querySelector('#musicFrame');let musicStarted=false,musicPlaying=true;function begin(){if(!musicStarted){musicFrame.src='https://www.youtube-nocookie.com/embed/UHJJrBWg6k8?autoplay=1&start=86&controls=0&loop=1&playlist=UHJJrBWg6k8&enablejsapi=1&playsinline=1';musicStarted=true}experience.classList.add('is-running')}function commandMusic(command){musicFrame.contentWindow?.postMessage(JSON.stringify({event:'command',func:command,args:[]}),'*')}start.addEventListener('click',begin);replay.addEventListener('click',()=>{experience.classList.add('resetting');experience.classList.remove('is-running');requestAnimationFrame(()=>requestAnimationFrame(()=>{experience.classList.remove('resetting');experience.classList.add('is-running')}))});musicToggle.addEventListener('click',()=>{musicPlaying=!musicPlaying;commandMusic(musicPlaying?'playVideo':'pauseVideo');musicToggle.textContent=musicPlaying?'♫ música':'♪ sin música';musicToggle.setAttribute('aria-label',musicPlaying?'Pausar música':'Reproducir música')});
